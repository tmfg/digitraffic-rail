services:
  db:
    image: mysql:8.0.46
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_swedish_ci']

  db-init:
    image: flyway/flyway:13.12.2-alpine@sha256:f5b9740a05ef38fc31356dcf2e7796dafc693ea289546e82c7699d37f83349af
    volumes:
      - "../AvoinDataUpdater/src/main/resources/db/:/flyway/sql"
      - "~/.m2:/root/.m2"
    links:
      - "db:db"
    command: -url=jdbc:mysql://db -schemas=avoindata_test -user=root -connectRetries=60 migrate
    depends_on:
      - db