services:
  db:
    image: mysql:8.0.46
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_swedish_ci']

  db-init:
    image: flyway/flyway:13.3.0-alpine@sha256:fb13953f16913efd313f202ec4b4ed34fd2ea14cc51401eb36ea9818c0df2918
    volumes:
      - "../AvoinDataUpdater/src/main/resources/db/:/flyway/sql"
      - "~/.m2:/root/.m2"
    links:
      - "db:db"
    command: -url=jdbc:mysql://db -schemas=avoindata_test -user=root -connectRetries=60 migrate
    depends_on:
      - db