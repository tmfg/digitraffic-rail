services:
  db:
    image: mysql:8.0.46
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_swedish_ci']

  db-init:
    image: flyway/flyway:13.9.0-alpine@sha256:ae8e985a8caf73181a39aad823690f27d55c850d4c5cea92a94c0ce4b3943156
    volumes:
      - "../AvoinDataUpdater/src/main/resources/db/:/flyway/sql"
      - "~/.m2:/root/.m2"
    links:
      - "db:db"
    command: -url=jdbc:mysql://db -schemas=avoindata_test -user=root -connectRetries=60 migrate
    depends_on:
      - db