name: Dependency check
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 8 * * *" # UTC
  workflow_dispatch:
jobs:
  dependency-check:
    if: github.repository != 'tmfg/digitraffic-rail'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: corretto
          cache: maven
      - name: Cache dependency-check files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-
      - name: Dependency check
        run: mvn -Pdepcheck
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Publish report on GitHub Pages
        if: ${{ success() || failure() }}
        uses: tmfg/digitraffic-actions@gh-pages-publish/v1
        with:
          GH_PAGES_BRANCH: gh-pages
          FILE_PATH: target/dependency-check-report.html
          COMMIT_MESSAGE: Upload dependency check report
          LINK_TEXT: Dependency check report
      - name: Notify Slack
        if: failure()
        uses: tmfg/digitraffic-actions@slack-notify/v1
        with:
          status: failure
          text: FAILED Rail Dependency Check
          fields: repo, job, took
          webhook-url: ${{ secrets.SLACK_WARNINGS_WEBHOOK_URL }}
