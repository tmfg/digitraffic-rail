name: Deploy from other repo
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: environment
        default: "beta"
      application-name:
        description: "Application to install"
        required: true
        type: choice
        options:
          - infra-api
          - etj2-api
      config-branch:
        description: "Config repo branch"
        default: master
        required: true
        type: string
      etj2_suffix:
        description: "ETJ2 suffix (db schema revision for the ETJ2 application)"
        required: false
        type: string
      infra_suffix:
        description: "Infra suffix (db schema revision for the Infra application)"
        required: false
        type: string
jobs:
  deploy:
    if: github.repository != 'tmfg/digitraffic-rail'
    environment: ${{ github.event.inputs.env }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Configure AWS credentials for rail-${{ github.event.inputs.env }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: gh-actions-deploy-rail-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Checkout CI-repo
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.CONFIG_REPO_NAME }}
          ssh-key: ${{ secrets.CONFIG_REPO_SSH_KEY }}
          ref: ${{ inputs.config-branch }}
          path: digitraffic-ci

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build CI/CDK Infra project
        working-directory: digitraffic-ci/aws/cdk/infra
        run: |
          pnpm install
          pnpm build:ci

      - name: Diff and deploy
        env:
          DEPLOY_ALL_CHANGES: true
          AWS_PROFILE: ${{ secrets.AWS_PROFILE }}
          ETJ2_SUFFIX: ${{ github.event.inputs.etj2_suffix }}
          INFRA_SUFFIX: ${{ github.event.inputs.infra_suffix }}
        working-directory: digitraffic-ci/aws/cdk/infra/scripts
        run: |
          pnpm install
          pnpm build
          pnpm run start:diff-and-deploy EtjApi${{ github.event.inputs.env == 'prod' && 'Prod' || 'Test' }}

      - name: Read SBOM config
        id: sbom-config
        run: |
          echo "config<<EOF" >> $GITHUB_OUTPUT
          cat digitraffic-ci/aws/sbom/rail.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "common<<EOF" >> $GITHUB_OUTPUT
          cat digitraffic-ci/aws/sbom/config.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT      

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: image
          image-ref: ${{ secrets.FIRA_ECR_URL }}/${{ github.event.inputs.application-name }}:digitraffic-${{ github.event.inputs.env }}
          format: cyclonedx
          output: ${{ github.event.inputs.application-name }}-sbom.json

      - name: Configure AWS credentials for SBOM
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ fromJson(steps.sbom-config.outputs.common).sbomUploadRoleArn }}
          role-session-name: gh-actions-upload-sbom-rail-mosquitto-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload SBOM
        run: |
          aws s3 cp ${{ github.event.inputs.application-name }}-sbom.json s3://${{ fromJson(steps.sbom-config.outputs.common).bucketArn }}/${{ fromJson(steps.sbom-config.outputs.config)[github.event.inputs.env][github.event.inputs.application-name] }}/${{ github.run_id }}-${{ github.sha }}.json

