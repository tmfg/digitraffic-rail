name: Install
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: environment
        default: "beta"
      ref:
        description: "Branch/tag/SHA of digitraffic-rail-private"
        required: true
        default: "master"
      diff-only:
        description: "Only run diff"
        required: true
        type: boolean
        default: false
      install-server:
        description: Install avoindata-server
        required: true
        type: boolean
        default: true
      install-updater:
        description: Install avoindata-updater
        required: true
        type: boolean
        default: true
      install-mqtt:
        description: Install Mosquitto
        required: true
        type: boolean
        default: false
      config-repo-branch:
        description: "Config repo branch"
        default: master
        required: true
        type: string
jobs:
  build:
    if: github.repository != 'tmfg/digitraffic-rail'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      actions: read
    environment: ${{ github.event.inputs.env }}
    outputs:
      git_sha: ${{ steps.git_sha.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Set git sha output
        id: git_sha
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          echo "sha_short=$GIT_SHA" >> $GITHUB_OUTPUT
      - name: Log workflow inputs and environment
        run: |
          echo "## Workflow Inputs" >> $GITHUB_STEP_SUMMARY
          echo "| Name | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| env | ${{ github.event.inputs.env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ref | ${{ github.event.inputs.ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "| config-repo-branch | ${{ github.event.inputs.config-repo-branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| install-server | ${{ github.event.inputs.install-server }} |" >> $GITHUB_STEP_SUMMARY
          echo "| install-updater | ${{ github.event.inputs.install-updater }} |" >> $GITHUB_STEP_SUMMARY
          echo "| install-mqtt | ${{ github.event.inputs.install-mqtt }} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: corretto
          cache: maven
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: gh-actions-install-rail-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build updater
        if: github.event.inputs.install-updater == 'true'
        run: |
          mvn install -DskipTests=true -Ddependency-check.skip=true
          
          cp AvoinDataUpdater/target/AvoinDataUpdater-*-SNAPSHOT.jar updater.jar
      - name: Build server
        if: github.event.inputs.install-server == 'true'
        run: |
          mvn install -DskipTests=true -Ddependency-check.skip=true
          
          cp AvoinDataServer/target/AvoinDataServer-*-SNAPSHOT.jar server.jar
      - name: Generate updater SBOM
        if: github.event.inputs.install-updater == 'true'
        run: |
          cd AvoinDataUpdater
          mvn -DoutputName=updater-sbom cyclonedx:makeBom
      - name: Generate server SBOM
        if: github.event.inputs.install-server == 'true'
        run: |
          cd AvoinDataServer
          mvn -DoutputName=server-sbom cyclonedx:makeBom
      - name: Upload server.jar
        if: github.event.inputs.install-server == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: server.jar
          path: server.jar
      - name: Upload updater.jar
        if: github.event.inputs.install-updater == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: updater.jar
          path: updater.jar
      - name: Upload server SBOM
        if: github.event.inputs.install-server == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: server-sbom.json
          path: AvoinDataServer/target/server-sbom.json
      - name: Upload updater SBOM
        if: github.event.inputs.install-updater == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: updater-sbom.json
          path: AvoinDataUpdater/target/updater-sbom.json
      - name: Notify Slack
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: FAILED Rail Install to ${{ github.event.inputs.env }}
          fields: repo, job, took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
  images:
    if: github.repository != 'tmfg/digitraffic-rail'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      actions: read
    environment: ${{ github.event.inputs.env }}
    steps:
      - name: Checkout CI-repo
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.CONFIG_REPO_NAME }}
          ssh-key: ${{ secrets.CONFIG_REPO_SSH_KEY }}
          ref: ${{ inputs.config-repo-branch }}
          path: digitraffic-ci
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: gh-actions-install-image-rail-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Download updater jar
        uses: actions/download-artifact@v8
        if: github.event.inputs.install-updater == 'true'
        with:
          name: updater.jar
          path: digitraffic-ci/aws
      - name: Download server jar
        uses: actions/download-artifact@v8
        if: github.event.inputs.install-server == 'true'
        with:
          name: server.jar
          path: digitraffic-ci/aws
      - name: Build docker image for updater
        if: github.event.inputs.install-updater == 'true'
        run: |
          cd digitraffic-ci/aws
          
          docker buildx build \
            --no-cache \
            --build-arg ENV=${{ github.event.inputs.env }} \
            --build-arg JAR_FILE=updater.jar \
            --build-arg PROPERTY_FILE=conf/rail/avoindataupdater-${{ github.event.inputs.env }}.properties \
            --build-arg LOGCONF_FILE=conf/rail/avoindataupdater-logback.xml \
            --platform linux/arm64 \
            --output type=docker \
            --tag ${{ secrets.ECR_URL }}/dt-rail-avoindata-updater-repository:${{ needs.build.outputs.git_sha }}-${{ github.run_id }} \
            --pull=true \
            --file=docker/Dockerfile-rail-avoindataupdater .
          
          docker push ${{ secrets.ECR_URL }}/dt-rail-avoindata-updater-repository:${{ needs.build.outputs.git_sha }}-${{ github.run_id }}

      - name: Put updater image tag in Parameter Store
        if: ${{ github.event.inputs.install-updater == 'true' }}
        run: |
          aws ssm put-parameter \
            --name "/rail/avoindata-updater/image-tag" \
            --value "${{ needs.build.outputs.git_sha }}-${{ github.run_id }}" \
            --type "String" \
            --overwrite
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Build docker image for server
        if: github.event.inputs.install-server == 'true'
        run: |
          cd digitraffic-ci/aws

          docker buildx build \
            --no-cache \
            --build-arg ENV=${{ github.event.inputs.env }} \
            --build-arg JAR_FILE=server.jar \
            --build-arg PROPERTY_FILE=conf/rail/avoindataserver-${{ github.event.inputs.env }}.properties \
            --build-arg LOGCONF_FILE=conf/rail/avoindataserver-logback.xml \
            --platform linux/arm64 \
            --output type=docker \
            --tag ${{ secrets.ECR_URL }}/dt-rail-avoindata-server-repository:${{ needs.build.outputs.git_sha }}-${{ github.run_id }} \
            --pull=true \
            --file=docker/Dockerfile-rail-avoindataserver .

          docker push ${{ secrets.ECR_URL }}/dt-rail-avoindata-server-repository:${{ needs.build.outputs.git_sha }}-${{ github.run_id }}

      - name: Put server image tag in Parameter Store
        if: ${{ github.event.inputs.install-server == 'true' }}
        run: |
          aws ssm put-parameter \
            --name "/rail/avoindata-server/image-tag" \
            --value "${{ needs.build.outputs.git_sha }}-${{ github.run_id }}" \
            --type "String" \
            --overwrite
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Build mqtt image
        run: |
          cd digitraffic-ci/aws/mqtt
          
          docker buildx build \
           --no-cache \
           --build-arg ENVIRONMENT=rail \
           --platform linux/arm64 \
           --output type=docker \
           --tag ${{ secrets.ECR_URL }}/dt-rail-mqtt-repository:${{ needs.build.outputs.git_sha }}-${{ github.run_id }} \
           --pull=true \
           --file=Dockerfile-rail .
          
          docker push ${{ secrets.ECR_URL }}/dt-rail-mqtt-repository:${{ needs.build.outputs.git_sha }}-${{ github.run_id }}

      - name: Put mqtt image tag in Parameter Store
        if: ${{ github.event.inputs.install-mqtt == 'true' }}
        run: |
          aws ssm put-parameter \
            --name "/rail/mqtt/image-tag" \
            --value "${{ needs.build.outputs.git_sha }}-${{ github.run_id }}" \
            --type "String" \
            --overwrite
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Notify Slack
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: FAILED Rail deploy/install
          fields: repo, job, took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
  install:
    if: github.repository != 'tmfg/digitraffic-rail'
    needs: [images, build]
    permissions:
      id-token: write
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    environment: ${{ github.event.inputs.env }}
    steps:
      - name: Checkout CI-repo
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.CONFIG_REPO_NAME }}
          ssh-key: ${{ secrets.CONFIG_REPO_SSH_KEY }}
          ref: ${{ inputs.config-repo-branch }}
          path: digitraffic-ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: gh-actions-install-rail-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build CI/CDK Infra project
        working-directory: digitraffic-ci/aws/cdk/infra
        run: |
          pnpm install
          pnpm build:ci

      - name: Get stacks to deploy
        uses: actions/github-script@v8
        id: get-stacks
        env:
          ENV: ${{ github.event.inputs.env }}
          INSTALL_SERVER: ${{ github.event.inputs.install-server }}
          INSTALL_UPDATER: ${{ github.event.inputs.install-updater }}
          INSTALL_MQTT: ${{ github.event.inputs.install-mqtt }}
        with:
          script: |
            const envSuffix = process.env.ENV === 'prod' ? 'Prod' : 'Test';
            const stacks = [];
            
            if (process.env.INSTALL_SERVER === 'true') {
              stacks.push(`AvoindataServer${envSuffix}`);
            }
            if (process.env.INSTALL_UPDATER === 'true') {
              stacks.push(`AvoindataUpdater${envSuffix}`);
            }
            if (process.env.INSTALL_MQTT === 'true') {
              stacks.push(`MqttService${envSuffix}`);
            }

            return stacks.join(',');
          result-encoding: string

      - name: Diff and deploy
        env:
          DEPLOY_ALL_CHANGES: true
          DIFF_ONLY: ${{ github.event.inputs['diff-only'] }}
          # the value of AWS_PROFILE is only used by the stack code, local AWS profile configurations are not being set up
          AWS_PROFILE: ${{ secrets.AWS_PROFILE }}
        working-directory: digitraffic-ci/aws/cdk/infra/scripts
        run: |
          pnpm install
          pnpm build
          pnpm run start:diff-and-deploy ${{steps.get-stacks.outputs.result}}      

      - name: Download server-SBOM
        if: github.event.inputs.install-server == 'true'
        uses: actions/download-artifact@v8
        with:
          name: server-sbom.json

      - name: Download updater-SBOM
        if: github.event.inputs.install-updater == 'true'
        uses: actions/download-artifact@v8
        with:
          name: updater-sbom.json

      - name: Read SBOM config
        id: sbom-config
        run: |
          echo "config<<EOF" >> $GITHUB_OUTPUT
          cat digitraffic-ci/aws/sbom/rail.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "common<<EOF" >> $GITHUB_OUTPUT
          cat digitraffic-ci/aws/sbom/config.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT      

      - name: Configure AWS credentials for SBOM install
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ fromJson(steps.sbom-config.outputs.common).sbomUploadRoleArn }}
          role-session-name: gh-actions-upload-sbom-rail-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload server SBOM
        if: github.event.inputs.install-server == 'true'
        run: |
          aws s3 cp server-sbom.json s3://${{ fromJson(steps.sbom-config.outputs.common).bucketArn }}/${{ fromJson(steps.sbom-config.outputs.config)[github.event.inputs.env]['server'] }}/${{ github.run_id }}-${{ github.sha }}.json
      - name: Upload updater SBOM
        if: github.event.inputs.install-updater == 'true'
        run: |
          aws s3 cp updater-sbom.json s3://${{ fromJson(steps.sbom-config.outputs.common).bucketArn }}/${{ fromJson(steps.sbom-config.outputs.config)[github.event.inputs.env]['updater'] }}/${{ github.run_id }}-${{ github.sha }}.json
      - name: Notify Slack
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: FAILED Rail install
          fields: repo, job, took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
